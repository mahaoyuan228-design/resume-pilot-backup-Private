ingTop&quot;:0,&quot;id&quot;:&quot;8659941359&quot;,&quot;title&quot;:&quot;banner&quot;,&quot;picUrls&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/6f60a284-c900-4dc1-b667-94419454a049.jpg&quot;}],&quot;type&quot;:&quot;bigBanner&quot;,&quot;showSearchBar&quot;:&quot;notShow&quot;},&quot;9479403154&quot;:{&quot;paddingBottom&quot;:1,&quot;paddingTop&quot;:1,&quot;id&quot;:&quot;9479403154&quot;,&quot;title&quot;:&quot;&quot;,&quot;picUrls&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/70a104cc-7954-4b82-8010-cc0a8eae0173.jpg&quot;}],&quot;type&quot;:&quot;longPic&quot;}}},&quot;orgId&quot;:&quot;chint&quot;,&quot;siteId&quot;:40745,&quot;createdAt&quot;:&quot;2021-08-10T06:34:46.000Z&quot;,&quot;updatedAt&quot;:&quot;2024-12-10T13:41:43.000Z&quot;,&quot;locale&quot;:&quot;zh-CN&quot;},{&quot;id&quot;:34389,&quot;title&quot;:&quot;小泰寻梦记&quot;,&quot;type&quot;:&quot;campus&quot;,&quot;settings&quot;:{&quot;moduleIds&quot;:[&quot;6451523036&quot;,&quot;8314590111&quot;,&quot;5921957373&quot;,&quot;4787835110&quot;,&quot;7004864727&quot;],&quot;moduleEntries&quot;:{&quot;5921957373&quot;:{&quot;subTitleColor&quot;:&quot;#575d6a&quot;,&quot;paddingBottom&quot;:1,&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;paddingTop&quot;:1,&quot;id&quot;:&quot;5921957373&quot;,&quot;title&quot;:&quot; &quot;,&quot;type&quot;:&quot;bigPic&quot;,&quot;items&quot;:[{&quot;paddingBottom&quot;:0,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;link&quot;:&quot;https://mp.weixin.qq.com/s/PlC5Hwdzbl1nwEDmr3Nalg&quot;,&quot;url&quot;:&quot;https://public-cdn.mokahr.com/9d4fffd9-17a5-4f6f-a884-d8529eeb0730.jpg&quot;}],&quot;videoUrl&quot;:&quot;https://mp.weixin.qq.com/s/PlC5Hwdzbl1nwEDmr3Nalg&quot;,&quot;type&quot;:&quot;image&quot;},&quot;paddingTop&quot;:0,&quot;content&quot;:&quot;&quot;}]},&quot;4787835110&quot;:{&quot;subTitleColor&quot;:&quot;#575d6a&quot;,&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;paddingTop&quot;:1,&quot;id&quot;:&quot;4787835110&quot;,&quot;title&quot;:&quot;&quot;,&quot;type&quot;:&quot;mixPic&quot;,&quot;items&quot;:[{&quot;titleColor&quot;:&quot;#000000&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/3bf95fcf-18c0-4255-899a-f0a0dc9ee1a8.jpg&quot;}]},&quot;title&quot;:&quot;萌新互动  少年未来可期&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;董事长的到来，给了现场的“萌新小泰”们大大的鼓舞。南存辉特地预留了时间和大家互动交流。作为正泰新力量，能有机会对话“当家人”，可以说是一份珍贵的入职见面礼&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/7e298e08-8ef2-4fe4-9bab-8faf6ced1c0e.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;毕业于香港岭南大学的小伙伴第一个举起了手，他目前任职正泰新能源人力资源岗位，对正泰靠什么吸引人才很感兴趣。南存辉用“平台、氛围、文化”三个关键词解答了小伙伴的疑问。他说，正泰创业创新至今37年，从低压电器一路发展到新能源，打造了一个可以让大家成就事业、成就梦想的平台。其次，正泰一直致力于打造理想的环境氛围，在这个氛围中，我们的创造、付出、成就和价值能够得到认可和回报。南存辉最后强调，正泰提倡尊重成功、包容失败的创新文化，在正泰，只要奋斗拼搏，任何人都可以放心大胆去创新创造。“正是因为我们有这样的平台，有了创新创业的文化氛围，才能不断吸引人才来正泰成就事业、成就梦想、成就价值。”南存辉说。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/8f15cfc4-d79a-42e0-a6f7-08d64b587a1f.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;南存辉刚说完，没等主持人开口，现场小伙伴你争我抢地举起了手。最后，毕业于东北大学进入正泰电气工作的小伙伴抢到了难得的机会。他对正泰电气以及行业的发展规划和未来前景充满了好奇。对此，南存辉表示，新央企中国电力装备集团即将挂牌，高压输配电在这个领域中大有可为。目前新能源行业快速发展，也为输配电行业提供了广阔的发展前景。正泰输配电板块在上海有多年基础，现在已进入第二个发展阶段，正在不断集聚人才，那里是个研发的大平台，正需要新人们大展拳脚。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#000000&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/1be8d667-350d-41dc-83cc-03e51223c156.jpg&quot;}]},&quot;title&quot;:&quot;寄语未来  奋斗谦学勇进&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;交流互动后，南存辉对全体“新正泰人”发表了题为《奋斗正青春 “泰”有可为》的讲话。他首先代表全集团对新入职的员工表示热烈欢迎，阐述了正泰精神和正泰未来，并寄语“新正泰人”。他表示，要坚持“三个相信”：相信党中央的智慧，相信市场机制的作用，相信中国优秀传统文化的力量。南存辉说，时代潮流滚滚向前，国家政策势必越来越好，我们要抢抓机遇，顺势而为。南存辉还送给新员工三句话：听中央的，不忘初心，牢记使命；看欧美的，取之所长，补己之短；干自己的，敬畏规则，知止而行，行稳致远。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;南存辉强调，“新正泰人”离开象牙塔，走上新的工作岗位，要专注坚守，不忘初心，时刻谨记没有平凡的岗位，只有平凡的态度，要发扬螺丝钉精神，做好本职工作。世上唯一不变的就是变，要谦学勇进，创新突破，去创造属于自己的未来！&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#000000&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/9053d6fb-7576-457c-a184-3f8c522af0d7.jpg&quot;}]},&quot;title&quot;:&quot;“大咖”分享  传承永不止步&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;在这次培训中，集团轮值总裁栾广富给新员工介绍了公司的发展历程、产业布局、“一云两网”战略以及“产业大脑+未来工厂”等相关情况，从技术角度为新员工描绘了正泰数字化转型与未来发展的蓝图。他希望，新员工能在正泰各显所长，与公司同成长、共奋进。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/a58ec2b8-627c-48d6-b938-ba4510fb2075.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; 集团人力薪酬委员会办公室主任、人力资源部总经理朱要武从人才理念、人才标准、人才培养体系、薪酬激励机制、员工关怀等方面对正泰人才发展战略作了系统阐述，他寄语新员工：乾坤未定，你我皆是黑马；找准赛道，未来无限可能！&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/c9625d00-a016-4ae5-bcce-a197556f3f66.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;正泰学院副教务长廖毅与新员工分享了正泰发展历史中的文化积淀。一张修鞋的老照片、一封特殊的感谢信、一枚埃及钱币图案上的秘密……一个个生动的故事徐徐展开，正泰的企业文化扑面而来。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/c699d782-72df-40f0-82a8-6bd75bd6228a.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;培训中，还邀请了优秀管理者和优秀员工骨干为大家分享在正泰的发展故事。他们曾经也是“新正泰人”，如今作为“过来人”，他们讲述自己的故事，传承就此启步。正泰新能源生产服务部副总经理韩玮智、正泰新能源杭州组件工厂生产经理黄冲、正泰新能源电站运维事业部工程师刘昕稷分别作为代表，以自己的工作经历和成长历程为引，带大家进入“正泰人”的职场天地。方向、环境、心态、企业文化……在他们的描述中，新员工对未来有了更明晰的认知。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/b3a5e8dd-f1bb-4b21-8a6a-82f08a7c9e67.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;  这趟文化之旅，除了室内的交流与分享，还有室外的拓展与活动。青春无限，奋斗不止，在这里，“新正泰人”展现了属于他们自己的风采与活力。逐梦启航，我们一起加油干！&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/4b72aeab-2195-48f5-9f4f-e5f0f6dff5fe.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;  集团人力资源部副总经理、杭州区域共享服务中心负责人郎英，集团人力资源部温州区域共享服务中心负责人、正泰电器人力资源部总经理计宪群，集团人力资源部上海区域共享服务中心负责人、正泰电气人力资源部副总经理付祎，正泰中自常务副总经理沈学明等出席了活动。&lt;/span&gt;&lt;/p&gt;&quot;}]},&quot;8314590111&quot;:{&quot;paddingBottom&quot;:&quot;&quot;,&quot;paddingTop&quot;:1,&quot;id&quot;:&quot;8314590111&quot;,&quot;title&quot;:&quot;&quot;,&quot;picUrls&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/bd7652b0-312d-4810-9b48-736d29953586.jpg&quot;}],&quot;type&quot;:&quot;longPic&quot;},&quot;6451523036&quot;:{&quot;paddingBottom&quot;:0,&quot;bannerTitle&quot;:&quot;&quot;,&quot;bannerTitleColor&quot;:&quot;#575d6a&quot;,&quot;bannerSubTitle&quot;:&quot;&quot;,&quot;bannerSubTitleColor&quot;:&quot;#575d6a&quot;,&quot;paddingTop&quot;:0,&quot;id&quot;:&quot;6451523036&quot;,&quot;title&quot;:&quot;banner&quot;,&quot;picUrls&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/4239dfb4-61bc-4f89-8f69-ee4f83a215e6.jpg&quot;}],&quot;type&quot;:&quot;bigBanner&quot;,&quot;showSearchBar&quot;:&quot;notShow&quot;},&quot;7004864727&quot;:{&quot;subTitleColor&quot;:&quot;#575d6a&quot;,&quot;paddingBottom&quot;:1,&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;paddingTop&quot;:0,&quot;id&quot;:&quot;7004864727&quot;,&quot;title&quot;:&quot;&quot;,&quot;type&quot;:&quot;text&quot;,&quot;content&quot;:&quot;&lt;p class=\&quot;ql-align-center\&quot;&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;出发时，你们来自天南地北&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;ql-align-center\&quot;&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;此刻，我们汇聚于共同的家园&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;ql-align-center\&quot;&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;    在这里，我们可以挥洒汗水，逐梦未来&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;ql-align-center\&quot;&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;    在这里，我们一起创造无限可能&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;ql-align-center\&quot;&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;    让我们携手踏上新旅程吧！&lt;/span&gt;&lt;/p&gt;&quot;}}},&quot;mobileSettings&quot;:{&quot;moduleIds&quot;:[&quot;6451523036&quot;,&quot;8314590111&quot;,&quot;5921957373&quot;,&quot;4787835110&quot;,&quot;7004864727&quot;],&quot;moduleEntries&quot;:{&quot;5921957373&quot;:{&quot;subTitleColor&quot;:&quot;#575d6a&quot;,&quot;paddingBottom&quot;:1,&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;paddingTop&quot;:1,&quot;id&quot;:&quot;5921957373&quot;,&quot;title&quot;:&quot; &quot;,&quot;type&quot;:&quot;bigPic&quot;,&quot;items&quot;:[{&quot;paddingBottom&quot;:0,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;link&quot;:&quot;https://mp.weixin.qq.com/s/PlC5Hwdzbl1nwEDmr3Nalg&quot;,&quot;url&quot;:&quot;https://public-cdn.mokahr.com/9d4fffd9-17a5-4f6f-a884-d8529eeb0730.jpg&quot;}],&quot;videoUrl&quot;:&quot;https://mp.weixin.qq.com/s/PlC5Hwdzbl1nwEDmr3Nalg&quot;,&quot;type&quot;:&quot;image&quot;},&quot;paddingTop&quot;:0,&quot;content&quot;:&quot;&quot;}]},&quot;4787835110&quot;:{&quot;subTitleColor&quot;:&quot;#575d6a&quot;,&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;paddingTop&quot;:1,&quot;id&quot;:&quot;4787835110&quot;,&quot;title&quot;:&quot;&quot;,&quot;type&quot;:&quot;mixPic&quot;,&quot;items&quot;:[{&quot;titleColor&quot;:&quot;#000000&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/3bf95fcf-18c0-4255-899a-f0a0dc9ee1a8.jpg&quot;}]},&quot;title&quot;:&quot;萌新互动  少年未来可期&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;董事长的到来，给了现场的“萌新小泰”们大大的鼓舞。南存辉特地预留了时间和大家互动交流。作为正泰新力量，能有机会对话“当家人”，可以说是一份珍贵的入职见面礼&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/7e298e08-8ef2-4fe4-9bab-8faf6ced1c0e.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;毕业于香港岭南大学的小伙伴第一个举起了手，他目前任职正泰新能源人力资源岗位，对正泰靠什么吸引人才很感兴趣。南存辉用“平台、氛围、文化”三个关键词解答了小伙伴的疑问。他说，正泰创业创新至今37年，从低压电器一路发展到新能源，打造了一个可以让大家成就事业、成就梦想的平台。其次，正泰一直致力于打造理想的环境氛围，在这个氛围中，我们的创造、付出、成就和价值能够得到认可和回报。南存辉最后强调，正泰提倡尊重成功、包容失败的创新文化，在正泰，只要奋斗拼搏，任何人都可以放心大胆去创新创造。“正是因为我们有这样的平台，有了创新创业的文化氛围，才能不断吸引人才来正泰成就事业、成就梦想、成就价值。”南存辉说。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/8f15cfc4-d79a-42e0-a6f7-08d64b587a1f.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;南存辉刚说完，没等主持人开口，现场小伙伴你争我抢地举起了手。最后，毕业于东北大学进入正泰电气工作的小伙伴抢到了难得的机会。他对正泰电气以及行业的发展规划和未来前景充满了好奇。对此，南存辉表示，新央企中国电力装备集团即将挂牌，高压输配电在这个领域中大有可为。目前新能源行业快速发展，也为输配电行业提供了广阔的发展前景。正泰输配电板块在上海有多年基础，现在已进入第二个发展阶段，正在不断集聚人才，那里是个研发的大平台，正需要新人们大展拳脚。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#000000&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/1be8d667-350d-41dc-83cc-03e51223c156.jpg&quot;}]},&quot;title&quot;:&quot;寄语未来  奋斗谦学勇进&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;交流互动后，南存辉对全体“新正泰人”发表了题为《奋斗正青春 “泰”有可为》的讲话。他首先代表全集团对新入职的员工表示热烈欢迎，阐述了正泰精神和正泰未来，并寄语“新正泰人”。他表示，要坚持“三个相信”：相信党中央的智慧，相信市场机制的作用，相信中国优秀传统文化的力量。南存辉说，时代潮流滚滚向前，国家政策势必越来越好，我们要抢抓机遇，顺势而为。南存辉还送给新员工三句话：听中央的，不忘初心，牢记使命；看欧美的，取之所长，补己之短；干自己的，敬畏规则，知止而行，行稳致远。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;南存辉强调，“新正泰人”离开象牙塔，走上新的工作岗位，要专注坚守，不忘初心，时刻谨记没有平凡的岗位，只有平凡的态度，要发扬螺丝钉精神，做好本职工作。世上唯一不变的就是变，要谦学勇进，创新突破，去创造属于自己的未来！&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#000000&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/9053d6fb-7576-457c-a184-3f8c522af0d7.jpg&quot;}]},&quot;title&quot;:&quot;“大咖”分享  传承永不止步&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;在这次培训中，集团轮值总裁栾广富给新员工介绍了公司的发展历程、产业布局、“一云两网”战略以及“产业大脑+未来工厂”等相关情况，从技术角度为新员工描绘了正泰数字化转型与未来发展的蓝图。他希望，新员工能在正泰各显所长，与公司同成长、共奋进。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/a58ec2b8-627c-48d6-b938-ba4510fb2075.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; 集团人力薪酬委员会办公室主任、人力资源部总经理朱要武从人才理念、人才标准、人才培养体系、薪酬激励机制、员工关怀等方面对正泰人才发展战略作了系统阐述，他寄语新员工：乾坤未定，你我皆是黑马；找准赛道，未来无限可能！&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/c9625d00-a016-4ae5-bcce-a197556f3f66.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;正泰学院副教务长廖毅与新员工分享了正泰发展历史中的文化积淀。一张修鞋的老照片、一封特殊的感谢信、一枚埃及钱币图案上的秘密……一个个生动的故事徐徐展开，正泰的企业文化扑面而来。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/c699d782-72df-40f0-82a8-6bd75bd6228a.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;培训中，还邀请了优秀管理者和优秀员工骨干为大家分享在正泰的发展故事。他们曾经也是“新正泰人”，如今作为“过来人”，他们讲述自己的故事，传承就此启步。正泰新能源生产服务部副总经理韩玮智、正泰新能源杭州组件工厂生产经理黄冲、正泰新能源电站运维事业部工程师刘昕稷分别作为代表，以自己的工作经历和成长历程为引，带大家进入“正泰人”的职场天地。方向、环境、心态、企业文化……在他们的描述中，新员工对未来有了更明晰的认知。&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/b3a5e8dd-f1bb-4b21-8a6a-82f08a7c9e67.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;  这趟文化之旅，除了室内的交流与分享，还有室外的拓展与活动。青春无限，奋斗不止，在这里，“新正泰人”展现了属于他们自己的风采与活力。逐梦启航，我们一起加油干！&lt;/span&gt;&lt;/p&gt;&quot;},{&quot;titleColor&quot;:&quot;#575d6a&quot;,&quot;media&quot;:{&quot;picUrl&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/4b72aeab-2195-48f5-9f4f-e5f0f6dff5fe.jpg&quot;}]},&quot;title&quot;:&quot;&quot;,&quot;content&quot;:&quot;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;  集团人力资源部副总经理、杭州区域共享服务中心负责人郎英，集团人力资源部温州区域共享服务中心负责人、正泰电器人力资源部总经理计宪群，集团人力资源部上海区域共享服务中心负责人、正泰电气人力资源部副总经理付祎，正泰中自常务副总经理沈学明等出席了活动。&lt;/span&gt;&lt;/p&gt;&quot;}]},&quot;8314590111&quot;:{&quot;paddingBottom&quot;:&quot;&quot;,&quot;paddingTop&quot;:1,&quot;id&quot;:&quot;8314590111&quot;,&quot;title&quot;:&quot;&quot;,&quot;picUrls&quot;:[{&quot;url&quot;:&quot;https://public-cdn.mokahr.com/bd7652b0-312d-4810-9b48-736d29953586.jpg&quot;}],&quot;type&quot;:&quot;longPic&quot;},&quot;64
