<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>double select</title>
  <style>.ant-select, .ant-select-selection, .ant-select-selection-selected-value { display: block; min-height: 16px; }</style>
</head>
<body>
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>婚姻状况</label></div>
    <div class="ant-select"><div class="ant-select-selection"><div class="ant-select-selection-selected-value">未婚</div></div></div>
    <div class="ant-select"><div class="ant-select-selection"><div class="ant-select-selection-selected-value">已婚</div></div></div>
  </div>
</body>
</html>
