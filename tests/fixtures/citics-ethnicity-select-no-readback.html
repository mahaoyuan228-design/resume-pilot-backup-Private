<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>missing readback</title>
  <style>.ant-select, .ant-select-selection { display: block; min-height: 16px; }</style>
</head>
<body>
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>民族</label></div>
    <div class="ant-select"><div class="ant-select-selection"><span class="placeholder">请选择</span></div></div>
  </div>
  <script>window.__opened = 0; document.querySelector('.ant-select-selection').addEventListener('mousedown', () => { window.__opened += 1; });</script>
</body>
</html>
