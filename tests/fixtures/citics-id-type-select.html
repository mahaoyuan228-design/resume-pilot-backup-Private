<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>完善简历-总部校园招聘</title>
  <link rel="stylesheet" href="/__citics_assets__/antd-1.7.8.css">
</head>
<body>
  <div id="app">
    <a-form :label-col="{ span: 6 }" :wrapper-col="{ span: 12 }">
      <a-form-item label="姓">
        <a-input v-model="last"></a-input>
      </a-form-item>
      <a-form-item label="证件类型" required>
        <a-select v-model="idType" style="width: 240px">
          <a-select-option value="身份证">身份证</a-select-option>
          <a-select-option value="中国护照">中国护照</a-select-option>
          <a-select-option value="港澳居民来往内地通行证">港澳居民来往内地通行证</a-select-option>
          <a-select-option value="台湾居民来往大陆通行证">台湾居民来往大陆通行证</a-select-option>
        </a-select>
      </a-form-item>
      <a-form-item label="民族" required>
        <a-select v-model="nation" style="width: 240px">
          <a-select-option value="汉族">汉族</a-select-option>
          <a-select-option value="回族">回族</a-select-option>
        </a-select>
      </a-form-item>
    </a-form>
    <button type="button" id="save">保存</button>
    <button type="button" id="draft">暂存</button>
    <button type="button" id="submit">提交</button>
  </div>
  <script src="/__citics_assets__/vue-2.7.16.js"></script>
  <script src="/__citics_assets__/antd-1.7.8.js"></script>
  <script>
    Vue.use(antd);
    window.__citicsCommitClicks = 0;
    document.addEventListener('click', event => {
      const node = event.target.closest('button, a');
      const text = (node?.textContent || '').replace(/\s+/g, '');
      if (node && /保存|提交|暂存/.test(text)) window.__citicsCommitClicks += 1;
    }, true);
    new Vue({ el: '#app', data: { last: '测', idType: '身份证', nation: '汉族' } });
  </script>
</body>
</html>
