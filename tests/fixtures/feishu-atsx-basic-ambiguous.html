<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Feishu ATSX ambiguous/missing fixture (offline · JS-confirmed classes)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1f2329; }
    .atsx-form-item { margin: 1rem 0; }
    .atsx-form-item-label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    .atsx-input { width: 100%; padding: 0.4rem 0.5rem; border: 1px solid #ccc; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="bd">
    <p>Offline fail-closed case for siteId feishu-atsx. Same JS-confirmed
      <code>.atsx-form-item</code> contract as the ready fixture. Duplicate 姓名 and a missing 邮箱.
      Not a new live class.</p>

    <form class="atsx-form" action="#" onsubmit="return false;">
      <div class="atsx-form-item" data-field="姓名">
        <div class="atsx-form-item-label"><label>姓名</label></div>
        <div class="atsx-form-item-control">
          <input class="atsx-input" type="text" name="fullName-a" value="KEEP-A" />
        </div>
      </div>

      <div class="atsx-form-item" data-field="姓名-dup">
        <div class="atsx-form-item-label"><label>姓名</label></div>
        <div class="atsx-form-item-control">
          <input class="atsx-input" type="text" name="fullName-b" value="KEEP-B" />
        </div>
      </div>

      <div class="atsx-form-item" data-field="手机号码">
        <div class="atsx-form-item-label"><label>手机号码</label></div>
        <div class="atsx-form-item-control">
          <input class="atsx-input" type="tel" name="mobile" value="KEEP-PHONE" />
        </div>
      </div>

      <button type="button" id="save-btn" class="atsx-btn">保存</button>
      <button type="button" id="submit-btn" class="atsx-btn">提交</button>
      <button type="button" id="deliver-btn" class="atsx-btn">投递</button>
    </form>
  </div>
</body>
</html>
